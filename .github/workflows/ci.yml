name: CI

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      SCOUTIQ_AGENT_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked, untracked, and historical content for secrets
        run: pnpm run security:secrets

      - name: Audit Node dependencies
        run: pnpm audit --audit-level=moderate

      - name: Audit Python dependencies
        run: python -m pip_audit --strict -r requirements-dev.txt

      - name: Build API and web
        run: pnpm run build

      - name: Check frontend source and production build environment boundary
        run: pnpm run security:frontend

      - name: Run API tests
        run: pnpm run test:api

      - name: Run smoke helper tests
        run: pnpm run test:smoke

      - name: Run pipeline tests
        run: pnpm run pipeline:test

      - name: Run model tests
        run: pnpm run model:test

      - name: Run PySpark transformation tests
        run: pnpm run databricks:test

      - name: Run public snapshot packaging tests
        run: pnpm run databricks:snapshot:test

      - name: Run resume metrics tests
        run: pnpm run resume:metrics:test
